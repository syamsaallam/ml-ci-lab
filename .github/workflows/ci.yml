
name: ML CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:    
      - name: Get the code        # ambil dulu codingannya dari repo
        uses: actions/checkout@v6

      - name: Set up Python       
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run:
          pip install -r requirements.txt

      - name: Run tests (CI)      # bikin validation datanya dulu
        run: pytest -v test_train.py

      - name: Train model
        run: python train.py

      - name: Deliver model (CD)      # continous deployment kedalam joblib dan jsonnya 
        uses: actions/upload-artifact@v7
        with:
          name: model
          path: |
            model.joblib
            metrics.json
